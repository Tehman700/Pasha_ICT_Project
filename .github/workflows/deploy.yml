name: Deploy

# Deploys to the EC2 box on push to main.
#
# Path filters mean a backend-only change does not rebuild Next.js, and a
# frontend-only change does not restart the API. On a 1.9GB box an unnecessary
# Next build is not free — it is the biggest memory event on the machine.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "apps/admin-web/**"
      - "packages/**"
      - "scripts/deploy-*.sh"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  # Never let two deploys race on the same box.
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  SECURITY_GROUP: sg-0c5a68de07153ba87
  EC2_HOST: 13.205.248.87
  EC2_USER: ubuntu

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/deploy-backend.sh'
            web:
              - 'apps/admin-web/**'
              - 'packages/**'
              - 'scripts/deploy-admin-web.sh'

  deploy:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # SSH on this box is closed to the internet and allowed only from known
      # developer IPs. GitHub's runners have dynamic addresses from a huge
      # pool, so rather than punching a permanent hole, each run opens port 22
      # to its own address for the length of the deploy and closes it again in
      # a step that runs even when the deploy fails.
      - name: Open SSH for this runner
        id: sg
        run: |
          RUNNER_IP=$(curl -s --max-time 10 https://api.ipify.org)
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id "$SECURITY_GROUP" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$RUNNER_IP/32,Description=github-actions-${{ github.run_id }}}]"
          echo "opened for $RUNNER_IP"

      - name: Install SSH key
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy backend
        if: needs.changes.outputs.backend == 'true'
        run: |
          scp -i ~/.ssh/deploy.pem scripts/deploy-backend.sh "$EC2_USER@$EC2_HOST:/tmp/"
          ssh -i ~/.ssh/deploy.pem "$EC2_USER@$EC2_HOST" \
            "sudo DB_PASSWORD='${{ secrets.DB_PASSWORD }}' JWT_SECRET='${{ secrets.JWT_SECRET }}' bash /tmp/deploy-backend.sh"

      - name: Deploy admin web
        if: needs.changes.outputs.web == 'true'
        run: |
          scp -i ~/.ssh/deploy.pem scripts/deploy-admin-web.sh "$EC2_USER@$EC2_HOST:/tmp/"
          ssh -i ~/.ssh/deploy.pem "$EC2_USER@$EC2_HOST" "sudo bash /tmp/deploy-admin-web.sh"

      - name: Smoke test
        run: |
          set -e
          echo "api:"
          curl -fsS --max-time 30 https://api.tideover.site/health | tee /dev/stderr | grep -q '"status":"ok"'
          echo ""
          echo "admin:"
          curl -fsS -o /dev/null -w "  HTTP %{http_code}\n" --max-time 30 https://admin.tideover.site/

      # `always()` matters: if the deploy or the smoke test fails, the hole
      # must still close. Otherwise a failed run leaves SSH open to a stale
      # runner address indefinitely.
      - name: Close SSH
        if: always() && steps.sg.outputs.runner_ip != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SECURITY_GROUP" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.sg.outputs.runner_ip }}/32}]" \
            || echo "rule already removed"
          echo "closed"
